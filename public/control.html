<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control · Iron Lion 4977</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .panel { display: grid; gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; }
    .card h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 12px; letter-spacing: -.01em; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .field input { background: var(--black); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text); padding: 10px 12px; font: inherit; font-size: 16px; width: 120px; }
    .field input[type="datetime-local"] { width: auto; }
    .btn {
      border: 1px solid var(--border); background: var(--steel-dark); color: var(--text);
      border-radius: var(--r-sm); padding: 12px 16px; font-weight: 700; cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
    }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--orange); border-color: var(--orange); color: var(--black); }
    .btn.big { font-size: 18px; padding: 16px 22px; font-family: var(--font-display); letter-spacing: .02em; }
    .btn.ghost { background: transparent; }
    .status { font-family: var(--font-display); font-size: 26px; font-weight: 800; margin: 0; }
    .status em { font-style: normal; color: var(--orange); }
    .mono { font-variant-numeric: tabular-nums; }
    .grid7 { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
    .grid7 .btn { padding: 12px 0; text-align: center; font-family: var(--font-display); font-size: 20px; }
    .grid7 .btn[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: var(--black); }
    .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--orange); color: var(--black); font-weight: 700; padding: 10px 16px; border-radius: 999px; transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out); pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="/logo.png" alt="" width="40" height="40">
      <span class="brand-text"><b>IRON LION</b><small>Control de rondas · staff</small></span>
    </a>
    <div class="live" id="live" data-state="loading"><span class="dot"></span><span id="live-text">Conectando…</span></div>
  </header>

  <main class="app panel">
    <p class="eyebrow">Panel del staff</p>
    <p class="status" id="status">Cargando…</p>

    <section class="card">
      <h2>Ronda en curso</h2>
      <div class="grid7" id="manualGrid"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" id="manualPrev">← Anterior</button>
        <button class="btn primary big" id="manualNext">Siguiente ronda →</button>
        <button class="btn ghost" id="reset">Reiniciar (aún no empieza)</button>
      </div>
      <p class="note">La ronda cambia solo cuando tú la cambias. Todos los teléfonos se actualizan solos en menos de 10 s.</p>
    </section>

  </main>
  <div class="toast" id="toast"></div>

  <script>
    const $ = (s) => document.querySelector(s);
    let sched = null, roundCount = 9, offset = 0;

    fetch("/data.json").then(r => r.json()).then(d => { roundCount = d.roundCount; drawGrid(); });

    async function load() {
      const r = await fetch("/api/state", { cache: "no-store" });
      sched = await r.json();
      offset = Date.parse(sched.serverTime) - Date.now();
      render();
    }

    async function post(body) {
      const r = await fetch("/api/state", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (!r.ok) { toast(j.error || "Error"); return; }
      sched = j; offset = Date.parse(j.serverTime) - Date.now();
      toast("Guardado"); render();
    }

    function compute() {
      if (!sched) return { phase: "off" };
      return sched.manualRound ? { phase: "live", round: Math.min(roundCount, sched.manualRound) } : { phase: "pre" };
    }

    function render() {
      const c = compute();
      const st = $("#status"), live = $("#live"), lt = $("#live-text");
      const map = {
        off: ["Conectando…", "loading", "Conectando…"],
        pre: ["Aún no empieza", "idle", "Por comenzar"],
        live: [`Ronda <em>${c.round}</em> de ${roundCount}`, "live", `Ronda ${c.round} en curso`],
      }[c.phase];
      st.innerHTML = map[0]; live.dataset.state = map[1]; lt.textContent = map[2];
      document.querySelectorAll("#manualGrid .btn").forEach(b => b.setAttribute("aria-pressed", !!sched && +b.dataset.r === sched.manualRound));
    }

    function drawGrid() {
      const g = $("#manualGrid"); g.innerHTML = "";
      for (let r = 1; r <= roundCount; r++) {
        const b = document.createElement("button");
        b.className = "btn"; b.textContent = r; b.dataset.r = r;
        b.addEventListener("click", () => post({ manualRound: r }));
        g.appendChild(b);
      }
      render();
    }

    $("#manualNext").addEventListener("click", () => post({ manualRound: Math.min(roundCount, (sched?.manualRound || 0) + 1) }));
    $("#manualPrev").addEventListener("click", () => post({ manualRound: Math.max(0, (sched?.manualRound || 0) - 1) }));
    $("#reset").addEventListener("click", () => post({ manualRound: 0 }));

    let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1600); }

    load().catch(() => { $("#status").textContent = "No se pudo conectar a /api/state"; });
    setInterval(render, 1000);
    setInterval(() => load().catch(() => {}), 10000);
  </script>
</body>
</html>
